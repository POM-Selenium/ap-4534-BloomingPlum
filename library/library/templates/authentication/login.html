{% extends "base.html" %}

{% block title %}Login - Library{% endblock %}

{% block content %}
<h1>Login</h1>

{% if error %}
<div class="errors">
    <p>{{ error }}</p>
</div>
{% endif %}

<div class="card">
    <form method="post" action="{% url 'authentication:login' %}">
        {% csrf_token %}

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   value="{{ email|default:'' }}" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary">Login</button>
        <a href="{% url 'authentication:register' %}" style="margin-left: 15px;">Don't have an account? Register</a>
    </form>
</div>
{% endblock %}
